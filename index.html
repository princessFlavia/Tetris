<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris Tower</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      main {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .stage {
        position: relative;
      }
      #board {
        display: block;
        border: 2px solid #334155;
        border-radius: 4px;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(15, 23, 42, 0.75);
        border-radius: 4px;
        text-align: center;
        padding: 0 24px;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay strong {
        font-size: 28px;
      }
      aside {
        background: var(--panel);
        padding: 16px 20px;
        border-radius: 8px;
        min-width: 160px;
      }
      dl {
        margin: 0;
      }
      dt {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 12px;
      }
      dt:first-child {
        margin-top: 0;
      }
      dd {
        margin: 2px 0 0;
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .preview canvas {
        display: block;
        margin-top: 6px;
        border-radius: 4px;
      }
      .floor-map canvas {
        display: block;
        margin-top: 6px;
      }
      .floor-status {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .controls {
        margin-top: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      kbd {
        background: #1e293b;
        border-radius: 3px;
        padding: 0 5px;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <canvas id="board"></canvas>
        <div id="overlay" class="overlay" hidden>
          <strong id="overlay-title"></strong>
          <span id="overlay-hint"></span>
        </div>
      </div>
      <aside>
        <dl>
          <dt>Next</dt>
          <dd class="preview"><canvas id="next"></canvas></dd>
          <dt>Floor map</dt>
          <dd class="floor-map">
            <canvas id="floor-map"></canvas>
            <span id="floor-status" class="floor-status"></span>
          </dd>
          <dt>Score</dt>
          <dd id="score">0</dd>
          <dt>Floors</dt>
          <dd id="layers">0</dd>
          <dt>Level</dt>
          <dd id="level">0</dd>
          <dt>Best</dt>
          <dd id="best">0</dd>
        </dl>
        <div class="controls">
          <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> move<br />
          <kbd>Q</kbd> <kbd>E</kbd> turn flat<br />
          <kbd>W</kbd> <kbd>S</kbd> tip forward / back<br />
          <kbd>A</kbd> <kbd>D</kbd> roll left / right<br />
          <kbd>Shift</kbd> soft drop<br />
          <kbd>Space</kbd> drop<br />
          <kbd>P</kbd> pause · <kbd>R</kbd> restart
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
