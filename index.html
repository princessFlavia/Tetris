<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      main {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      canvas {
        border: 2px solid #334155;
        border-radius: 4px;
      }
      aside {
        background: var(--panel);
        padding: 16px 20px;
        border-radius: 8px;
        min-width: 160px;
      }
      dl {
        margin: 0;
      }
      dt {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 12px;
      }
      dt:first-child {
        margin-top: 0;
      }
      dd {
        margin: 2px 0 0;
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .controls {
        margin-top: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      kbd {
        background: #1e293b;
        border-radius: 3px;
        padding: 0 5px;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="board"></canvas>
      <aside>
        <dl>
          <dt>Score</dt>
          <dd id="score">0</dd>
          <dt>Lines</dt>
          <dd id="lines">0</dd>
          <dt>Level</dt>
          <dd id="level">0</dd>
          <dt>Best</dt>
          <dd id="best">0</dd>
        </dl>
        <div class="controls">
          <kbd>←</kbd> <kbd>→</kbd> move<br />
          <kbd>↑</kbd> rotate<br />
          <kbd>↓</kbd> soft drop<br />
          <kbd>Space</kbd> hard drop<br />
          <kbd>P</kbd> pause · <kbd>R</kbd> restart
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
